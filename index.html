    <!-- Warm up third-party origins used after first paint -->

    <!-- Fallback title only. All SEO meta tags (description, keywords, robots, og:*, twitter:*) are managed per-route by react-helmet-async via SEOHead.tsx to avoid duplicates. Social crawlers that don't run JS will still see the title; og:image fallback added below with property attr so Helmet can override it. -->
    <title>SkillTa — Find Your Perfect Tech Career Path</title>

    <meta property="og:image:width" content="1200" />

     <meta name="msvalidate.01" content="EADFD738305C6C3F61F46ABC9BACD5C3" />
     
     <!-- Google Adsense -->
      <meta name="google-adsense-account" content="ca-pub-9053181808447685">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--Adsterra Social Bar Script — injected after load so it never blocks parsing/LCP-->
    <script>
      (function () {
        function loadSocialBar() {
          var s = document.createElement('script');
          s.src = 'https://pl30419480.effectivecpmnetwork.com/9c/44/ec/9c44eccf7f12896784490412afba4c7b.js';
          s.async = true;
          document.body.appendChild(s);
        }
        function schedule() {
          if (window.requestIdleCallback) window.requestIdleCallback(loadSocialBar, { timeout: 4000 });
          else setTimeout(loadSocialBar, 2500);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>
  </body>
</html>
